# Full CivicLens stack. `docker compose up` brings up Postgres, the API (which
# migrates the schema on start), and the nginx-served frontend on :8080.
#
# The store starts empty — load real Sejm data with the one-shot ingest service:
#   docker compose run --rm ingest
# (uncapped term-10 backfill; add `--max-votings N` after the command to bound it).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: civiclens
      POSTGRES_PASSWORD: civiclens
      POSTGRES_DB: civiclens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civiclens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://civiclens:civiclens@postgres:5432/civiclens
    # Apply migrations, then serve.
    command: sh -c "python -m ingestion.migrate && uvicorn api.main:app --host 0.0.0.0 --port 8099"
    ports:
      - "8099:8099"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8099/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - api

  # One-shot data loader (not started by `up`). Run on demand:
  #   docker compose run --rm ingest
  ingest:
    build: .
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://civiclens:civiclens@postgres:5432/civiclens
    entrypoint: ["python", "-m", "ingestion"]
    command: ["--term", "10", "--delay", "0.3"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
