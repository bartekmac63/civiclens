# Placeholder compose file. Only PostgreSQL is wired up; the api and frontend
# services are left as TODOs to be filled in as those components are built.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: civiclens
      POSTGRES_PASSWORD: civiclens
      POSTGRES_DB: civiclens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # TODO: api service (FastAPI) once api/main.py is built out
  # TODO: frontend service (React) once the frontend exists

volumes:
  pgdata:
