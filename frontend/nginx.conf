# Serve the built SPA and reverse-proxy the API. The frontend fetches /api/...,
# so requests are same-origin; nginx forwards /api/<path> to the api service as
# /<path> (the trailing slash on proxy_pass strips the /api prefix).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8099/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: serve index.html for client-side routes (e.g. /mps/:id).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
