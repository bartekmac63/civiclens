[project]
name = "civiclens"
version = "0.0.0"
description = "Open-source parliamentary intelligence tool built on Poland's Sejm API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "numpy",          # vectorised co-voting kernel (analysis.metrics.pair_similarities)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx",          # also used by fastapi TestClient
    "respx",          # mock httpx in ingestion tests
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingestion", "analysis", "api", "api.routers"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["ingestion", "analysis", "api", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, comprehensions, simplify.
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# B008: FastAPI's Depends()/Query() default-argument pattern is intentional.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
# FastAPI route decorators are typed but mypy can't always prove it; allow them.
disallow_untyped_decorators = false

# Tests use pytest fixtures (injected params); keep strict typing on product
# code but don't force annotations on every fixture parameter.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
