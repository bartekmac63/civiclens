[project]
name = "civiclens"
version = "0.0.0"
description = "Open-source parliamentary intelligence tool built on Poland's Sejm API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "pandas",
    "networkx",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingestion", "analysis", "api"]
